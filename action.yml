name: ModelScope License Risk Watch
description: 监控 AI 模型血缘链上的许可证变更风险

inputs:
  project_path:
    description: 要扫描的用户项目路径
    required: false
    default: '.'
  api_key:
    description: ModelScope API Key，应从 GitHub Secrets 传入
    required: true

runs:
  using: composite
  steps:
    - name: Guard fork pull requests
      id: fork-guard
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::warning::Fork PR 无法读取仓库 Secrets；为避免泄露 MODELSCOPE_API_KEY，本次许可证风险扫描已跳过。"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python 3.10
      if: steps.fork-guard.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Validate ModelScope API key
      if: steps.fork-guard.outputs.skip != 'true'
      env:
        MODELSCOPE_API_KEY: ${{ inputs.api_key }}
      shell: bash
      run: |
        if [ -z "${MODELSCOPE_API_KEY:-}" ]; then
          echo "::error::未配置 MODELSCOPE_API_KEY。请在 Settings -> Secrets and variables -> Actions 中添加仓库 Secret。"
          exit 1
        fi

    - name: Install Python dependencies
      if: steps.fork-guard.outputs.skip != 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Prepare snapshot cache key
      if: steps.fork-guard.outputs.skip != 'true'
      id: snapshot-key
      shell: bash
      run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Restore previous BOM snapshot
      if: steps.fork-guard.outputs.skip != 'true'
      id: snapshot-cache
      uses: actions/cache/restore@v4
      with:
        path: .license-watch-cache/latest_bom.json
        key: license-watch-snapshot-${{ steps.snapshot-key.outputs.date }}
        restore-keys: |
          license-watch-snapshot-

    - name: Restore previous BOM as t0
      if: steps.fork-guard.outputs.skip != 'true'
      id: previous-snapshot
      shell: bash
      run: |
        if [ -f .license-watch-cache/latest_bom.json ]; then
          mv .license-watch-cache/latest_bom.json prev_bom.json
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "已恢复上一次 BOM 快照：prev_bom.json"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "缓存中没有历史 BOM，本次仅建立基线。"
        fi

    - name: Scan current project and create t1 BOM
      id: scan
      if: steps.fork-guard.outputs.skip != 'true'
      env:
        MODELSCOPE_API_KEY: ${{ inputs.api_key }}
        PYTHONUTF8: '1'
        PYTHONIOENCODING: utf-8
      shell: bash
      run: |
        ACTION_PATH="${{ github.action_path }}"
        PROJECT_PATH="${{ inputs.project_path }}"
        if [ -z "$PROJECT_PATH" ]; then
          PROJECT_PATH="."
        fi
        if [ "$PROJECT_PATH" = "." ]; then
          PROJECT_PATH="$GITHUB_WORKSPACE"
        else
          PROJECT_PATH="$(cd "$PROJECT_PATH" && pwd)"
        fi

        mkdir -p "$GITHUB_WORKSPACE/outputs"
        python "$ACTION_PATH/main.py" \
          --project "$PROJECT_PATH" \
          --output "$GITHUB_WORKSPACE/outputs/watch_report.md"

        BOM_PATH="$(find "$ACTION_PATH/outputs" -type f -name bom.json | head -n 1)"
        if [ -z "$BOM_PATH" ]; then
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::warning::项目扫描未生成 bom.json。请检查 project_path、ModelScope 模型标识和 api_key；本次跳过 diff 和风险检测。"
          exit 0
        fi

        echo "found=true" >> "$GITHUB_OUTPUT"
        cp "$BOM_PATH" "$GITHUB_WORKSPACE/latest_bom.json"
        echo "已将最新 BOM 复制为 latest_bom.json：$BOM_PATH"

    - name: Create first-run baseline report
      if: steps.fork-guard.outputs.skip != 'true' && steps.scan.outputs.found == 'true' && steps.previous-snapshot.outputs.found != 'true'
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/outputs"
        printf '%s\n' \
          '# AI 模型血缘风险传播报告' \
          '' \
          '> 对比区间：无（首次运行只建立基线）' \
          '> 状态：缓存中没有历史 BOM，本次已跳过 diff。' \
          '' \
          '后续运行会将本次 BOM 作为 t0，与新的项目扫描结果进行对比。' \
          > "$GITHUB_WORKSPACE/outputs/diff_report.md"

    - name: Compare previous and latest BOM
      if: steps.fork-guard.outputs.skip != 'true' && steps.scan.outputs.found == 'true' && steps.previous-snapshot.outputs.found == 'true'
      env:
        PYTHONUTF8: '1'
        PYTHONIOENCODING: utf-8
      shell: bash
      run: |
        python "${{ github.action_path }}/main.py" \
          --diff \
          --before prev_bom.json \
          --after latest_bom.json \
          --output outputs/diff_report.md

        if ! grep -q '对比区间' outputs/diff_report.md; then
          echo "::error::diff_report.md 缺少「对比区间」说明行。"
          exit 1
        fi

    - name: Detect confirmed license risk
      id: risk-check
      if: steps.fork-guard.outputs.skip != 'true' && steps.scan.outputs.found == 'true'
      shell: bash
      run: |
        # 只检查正文风险记录，排除报告末尾固定说明表中的 RISK_CONFIRMED，避免误报。
        CONFIRMED_LINES="$(awk '/^## .*证据等级与判定说明/ {exit} {print}' outputs/diff_report.md | grep -F 'RISK_CONFIRMED' || true)"
        if [ -n "$CONFIRMED_LINES" ]; then
          printf '%s\n' "$CONFIRMED_LINES"
          echo "::error::检测到 RISK_CONFIRMED，许可证风险检查未通过。"
          exit 1
        fi
        echo "未检测到 RISK_CONFIRMED，许可证风险检查通过。"

    - name: Stage latest BOM for cache
      if: steps.fork-guard.outputs.skip != 'true' && steps.scan.outputs.found == 'true'
      shell: bash
      run: |
        mkdir -p .license-watch-cache
        cp latest_bom.json .license-watch-cache/latest_bom.json

    - name: Save latest BOM snapshot
      if: steps.fork-guard.outputs.skip != 'true' && steps.scan.outputs.found == 'true'
      uses: actions/cache/save@v4
      with:
        path: .license-watch-cache/latest_bom.json
        key: license-watch-snapshot-${{ steps.snapshot-key.outputs.date }}
