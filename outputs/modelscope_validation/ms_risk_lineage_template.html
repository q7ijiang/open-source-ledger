<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModelScope 血缘风险传播图 — 开源账本</title>
<script src="echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f7fa; color: #2c3e50; }
  header { background: #fff; padding: 14px 24px; border-bottom: 2px solid #e5e9f0; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; color: #1f2d3d; }
  header .src { color: #606266; font-size: 13px; }
  header .stat { margin-left: auto; font-size: 13px; color: #909399; }
  .wrap { display: flex; gap: 14px; padding: 14px 24px; align-items: flex-start; }
  .main { flex: 1; min-width: 0; }
  .panel { width: 330px; background: #fff; border: 1px solid #e5e9f0; border-radius: 8px; padding: 16px; }
  .panel h3 { font-size: 15px; margin-bottom: 10px; color: #1f2d3d; }
  .panel .empty { color: #909399; font-size: 13px; }
  .kv { font-size: 13px; margin-bottom: 6px; }
  .kv b { color: #1f2d3d; }
  .ev { border-left: 3px solid #d0d7de; padding: 4px 10px; margin: 8px 0; background: #f8fafc; font-size: 12.5px; }
  .ev .lv-A { color: #2f7d32; font-weight: 600; } .ev .lv-B { color: #b8860b; font-weight: 600; } .ev .lv-C { color: #c0392b; font-weight: 600; }
  #chart { width: 100%; height: 560px; background: #fff; border: 1px solid #e5e9f0; border-radius: 8px; }
  .card { background: #fff; border: 1px solid #e5e9f0; border-radius: 8px; padding: 16px; margin-top: 14px; }
  .card h3 { font-size: 15px; margin-bottom: 10px; color: #1f2d3d; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #e5e9f0; padding: 7px 10px; text-align: left; }
  th { background: #f2f6fc; }
  tr.safe { background: #f0f9eb; } tr.warn { background: #fdf6ec; } tr.risk { background: #fef0f0; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; color: #fff; }
  .b-safe { background: #67c23a; } .b-warn { background: #e6a23c; } .b-risk { background: #f56c6c; }
  .legend-row { display: flex; gap: 18px; font-size: 13px; margin: 10px 2px; flex-wrap: wrap; }
  .legend-row i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .event-item { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #e5e9f0; }
  .event-item b { color: #c0392b; }
  footer { text-align: center; color: #c0c4cc; font-size: 12px; padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>ModelScope 血缘风险传播图</h1>
  <span class="src">来源：ModelScope（魔搭社区）· 开源账本 C 模块</span>
  <span class="stat" id="stat"></span>
</header>

<div class="wrap">
  <div class="main">
    <div class="legend-row">
      <span><i style="background:#f56c6c"></i>高风险（红灯）</span>
      <span><i style="background:#e6a23c"></i>潜在风险（黄灯）</span>
      <span><i style="background:#d3d7de"></i>安全（浅灰）</span>
      <span><i style="background:#c0392b;border-radius:2px;width:20px;height:4px"></i>红线箭头 = 风险传播（风险源 → 衍生体）</span>
      <span style="margin-left:4px;color:#606266">节点形状：○ 真实模型 · □ 聚合节点（适配/微调/合并/量化）· ◆ 数据集</span>
    </div>
    <div id="chart"></div>

    <div class="card">
      <h3>合规判定表（绿灯出表 · 红灯出图）</h3>
      <div style="overflow-x:auto"><table id="table"></table></div>
    </div>

    <div class="card">
      <h3>跨版本变更事件（t0 → t1，供 --diff 风险传播）</h3>
      <div id="events"></div>
    </div>
  </div>

  <aside class="panel">
    <h3>证据链与传播详情</h3>
    <div id="detail" class="empty">点击图中的<b>节点</b>查看 A/B/C 证据等级与原始值；点击<b>连线</b>查看传播路径证书（谁传染谁）。</div>
  </aside>
</div>

<footer>开源账本 · AI 模型血缘风险传播与开源合规清单工具（C：数据 + 渲染 + 可视化）</footer>

<script>
// ===== 数据（由生成脚本注入）=====
const DATA = {{DATA_JSON}};

// ---------- P/D/P 判定：节点着色 ----------
const WARN_LICENSES = ["qwen-research", "qwen-data-license", "Llama-2-Community", "OpenRAIL-M", "Gemma-Terms-of-Use"];
function judge(asset) {
  const lic = (asset.license || "").toString();
  if (!lic || lic === "None" || lic === "") return { code: "RISK_POTENTIAL", label: "潜在风险", color: "#e6a23c" };
  if (WARN_LICENSES.some(w => lic.includes(w))) return { code: "RISK_POTENTIAL", label: "潜在风险", color: "#e6a23c" };
  if (/(GPL|AGPL|SSPL|OFL|EUPL)/i.test(lic)) return { code: "RISK", label: "高风险", color: "#f56c6c" };
  if (/(Apache-2\.0|MIT|BSD|ISC|CC0|Unlicense|Zlib)/i.test(lic)) return { code: "SAFE", label: "安全", color: "#d3d7de" };
  return { code: "RISK_POTENTIAL", label: "潜在风险", color: "#e6a23c" };
}

// 传播路径证书 → 高风险边集合（谁传染谁）
const certPaths = new Set();
DATA.certificates.forEach(c => {
  const path = c.path || c.path_nodes || [];
  path.forEach(p => {
    if (p && p.source && p.target) certPaths.add(p.source + ">" + p.target);
    else if (c.source && c.target) certPaths.add(c.source + ">" + c.target);
  });
});

const nodeById = {};
DATA.nodes.forEach(n => nodeById[n.id] = n);

const nodes = DATA.nodes.map(n => {
  const j = judge(n);
  const isAgg = n.aggregate || (n.name || "").indexOf("(Total:") >= 0;
  return {
    id: n.id, name: n.name || n.id, value: n.version || "",
    x: n.x, y: n.y,
    symbol: isAgg ? "rect" : (n.type === "dataset" ? "diamond" : "circle"),
    symbolSize: isAgg ? 26 : (n.type === "model" ? 40 : 30),
    itemStyle: { color: j.color, borderColor: j.code === "RISK_POTENTIAL" ? "#e6a23c" : "#bbb", borderWidth: j.code === "RISK_POTENTIAL" ? 3 : 1.5, borderRadius: isAgg ? 5 : 0 },
    category: j.code,
    label: { show: true, formatter: () => (isAgg ? ((n.name || "").split(" · ").pop() || n.name) : (n.name || n.id)), fontSize: 11, color: "#333", position: n.lp || "bottom" },
    tooltip: {
      formatter: () => {
        const ev = (n.evidence || []).map(e => e.evidence_level || "").join("/") || "—";
        const agg = isAgg ? `<br/>聚合计数：${n.count || "—"}` : "";
        return `<b>${n.name}</b>${agg}<br/>版本：${n.version || "—"}<br/>类型：${n.type}${isAgg ? "（聚合节点）" : ""}<br/>许可证：${n.license || "未声明"}<br/>判定：${j.label}<br/>证据等级：${ev}`;
      }
    }
  };
});

// 风险传播边：命中路径证书，或一端为风险节点（红线 = 风险从风险源向其衍生体传播）
const nodeRiskById = {};
DATA.nodes.forEach(n => nodeRiskById[n.id] = judge(n).code);

const edges = DATA.edges.map(e => {
  const risky = certPaths.has(e.source + ">" + e.target) || certPaths.has(e.target + ">" + e.source)
    || (nodeRiskById[e.source] === "RISK_POTENTIAL" || nodeRiskById[e.source] === "RISK"
        || nodeRiskById[e.target] === "RISK_POTENTIAL" || nodeRiskById[e.target] === "RISK");
  return {
    source: e.source, target: e.target,
    edgeSymbol: ["none", "arrow"],
    edgeSymbolSize: [0, 11],
    label: { show: true, formatter: e.edge_type, fontSize: 10, color: risky ? "#c0392b" : "#7f8c8d", position: "middle" },
    lineStyle: {
      width: risky ? 4 : 2,
      color: risky ? "#c0392b" : (e.edge_type === "trained_on" ? "#2980b9" : "#95a5a6"),
      curveness: e.edge_type === "trained_on" ? 0.2 : 0,
      type: risky ? "solid" : (e.edge_type === "trained_on" ? "dashed" : "solid")
    },
    _edge: e
  };
});

const chart = echarts.init(document.getElementById("chart"));
window.__chart = chart; // 供自动化验证
chart.setOption({
  tooltip: { trigger: "item", backgroundColor: "#fff", borderColor: "#d0d7de", textStyle: { color: "#333" } },
  legend: { show: false },
  series: [{
    type: "graph", layout: "none", roam: true, draggable: true,
    data: nodes, links: edges,
    categories: [{ name: "RISK" }, { name: "RISK_POTENTIAL" }, { name: "SAFE" }],
    emphasis: { focus: "adjacency", label: { show: true, fontSize: 14, fontWeight: "bold", color: "#111" } }
  }]
});

// ---------- 点击交互 ----------
function renderNodeDetail(n) {
  let html = `<div class="kv"><b>${n.name}</b>（${n.type}）</div><div class="kv">版本：${n.version || "—"}</div>`;
  html += `<div class="kv">许可证：${n.license || "未声明"} → <span class="badge ${judge(n).code === "RISK" ? "b-risk" : (judge(n).code === "RISK_POTENTIAL" ? "b-warn" : "b-safe")}">${judge(n).label}</span></div>`;
  if (n.merge_status) html += `<div class="kv">合并状态：${n.merge_status}（${n.reason_code || ""}）</div>`;
  html += `<h4 style="font-size:13px;margin:10px 0 6px">证据链（A/B/C 证据等级）</h4>`;
  if (n.evidence && n.evidence.length) {
    n.evidence.forEach(e => {
      const lv = e.evidence_level || "—";
      let raw = (e.raw_value !== null && e.raw_value !== undefined) ? e.raw_value : "—";
      if (typeof raw === "object") { try { raw = JSON.stringify(raw); } catch (err) { raw = String(raw); } }
      html += `<div class="ev"><span class="lv-${lv}">[${lv}]</span> ${e.source_field || "—"}<br/>原始值：<code>${raw}</code>${e.source_api ? "<br/>来源：" + e.source_api : ""}</div>`;
    });
  } else html += `<div class="empty">无证据链（本地推断）</div>`;
  document.getElementById("detail").innerHTML = html;
}

function renderEdgeDetail(e) {
  const risky = certPaths.has(e.source + ">" + e.target) || certPaths.has(e.target + ">" + e.source);
  let html = `<div class="kv"><b>血缘边</b>：${e.edge_type}</div>`;
  html += `<div class="kv">证据等级：<span class="lv-${e.evidence_level || "B"}">[${e.evidence_level || "B"}]</span></div>`;
  html += `<div class="kv">方向：${e.source} → ${e.target}</div>`;
  if (risky) html += `<div class="kv" style="color:#c0392b"><b>⚠ 该连线位于风险传播路径上（谁传染谁）</b></div>`;
  else html += `<div class="empty">非传播路径连线</div>`;
  const related = DATA.certificates.filter(c => {
    const path = c.path || c.path_nodes || [];
    return path.some(p => (p.source === e.source && p.target === e.target) || (p.source === e.target && p.target === e.source));
  });
  if (related.length) {
    html += `<h4 style="font-size:13px;margin:10px 0 6px">path_certificates（传播路径证书）</h4>`;
    related.forEach(c => {
      html += `<div class="ev">判定：${c.decision || "—"}<br/>路径：${(c.path || c.path_nodes || []).map(p => p.source + " → " + p.target).join("；") || (c.source + " → " + c.target)}</div>`;
    });
  }
  document.getElementById("detail").innerHTML = html;
}

chart.on("click", function (p) {
  if (p.dataType === "node") {
    const n = nodeById[p.data.id];
    if (n) renderNodeDetail(n);
  } else if (p.dataType === "edge") {
    renderEdgeDetail(p.data._edge);
  }
});

// ---------- 合规判定表（绿灯出表） ----------
function renderTable() {
  const rows = DATA.nodes.map(n => {
    const j = judge(n);
    const cls = j.code === "RISK" ? "risk" : (j.code === "RISK_POTENTIAL" ? "warn" : "safe");
    const badge = `<span class="badge ${j.code === "RISK" ? "b-risk" : (j.code === "RISK_POTENTIAL" ? "b-warn" : "b-safe")}">${j.label}</span>`;
    return `<tr class="${cls}"><td>${n.name || "—"}</td><td>${n.version || "—"}</td><td>${n.license || "未声明"}</td><td>${badge}</td></tr>`;
  }).join("");
  document.getElementById("table").innerHTML = `<table><tr><th>模型名 / 组件名</th><th>版本</th><th>许可</th><th>判定结果</th></tr>${rows}</table>`;
}

// ---------- 变更事件 ----------
function renderEvents() {
  if (!DATA.events || !DATA.events.length) { document.getElementById("events").innerHTML = '<div class="empty">无变更事件</div>'; return; }
  const html = DATA.events.map(ev => {
    const before = ev.before && ev.before.license ? ev.before.license : "未声明";
    const after = ev.after && ev.after.license ? ev.after.license : "未声明";
    return `<div class="event-item"><b>${ev.event_type || "license_changed"}</b> — ${ev.entity_key || ev.asset_id || ""}<br/>` +
      `许可证：${before} → ${after}（判定：${ev.decision || "—"}）</div>`;
  }).join("");
  document.getElementById("events").innerHTML = html;
}

// ---------- 统计 ----------
document.getElementById("stat").textContent = `节点 ${DATA.nodes.length} · 边 ${DATA.edges.length} · 变更事件 ${DATA.events.length} · 路径证书 ${DATA.certificates.length}`;

renderTable();
renderEvents();
window.addEventListener("resize", () => chart.resize());
</script>
</body>
</html>
